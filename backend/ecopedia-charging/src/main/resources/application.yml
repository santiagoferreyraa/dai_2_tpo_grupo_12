spring:
  application:
    name: ecopedia-charging

  # Perfil por defecto: PostgreSQL, que es el motor sobre el que corren las demos.
  datasource:
    url: ${ECOPEDIA_DB_URL:jdbc:postgresql://localhost:5432/ecopedia}
    username: ${ECOPEDIA_DB_USER:ecopedia}
    password: ${ECOPEDIA_DB_PASSWORD}         # sin valor por defecto: sale del .env

  # El esquema lo gobierna Flyway. Los archivos van en src/main/resources/db/migration
  # y se nombran V<AAAAMMDD><HHmm>__descripcion.sql — con timestamp, NUNCA con V1/V2/V3.
  #
  # Con numeración secuencial, dos personas escriben "V3__" la misma tarde y chocan.
  # Con timestamp el choque es imposible por construcción. Ver README, "Migraciones".
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Un schema por artefacto, dentro de la misma base.
    #
    # Sin esto, core y charging compartirían la tabla flyway_schema_history: cada uno vería
    # las migraciones del otro como "aplicadas pero ausentes" y ninguno de los dos arrancaría.
    # Flyway crea el schema si no existe.
    schemas: charging

  jpa:
    hibernate:
      # 'validate', no 'update': Hibernate verifica que las entidades coincidan con lo que
      # creó Flyway, pero no toca el esquema. Con 'update' y cuatro personas contra la misma
      # base, el arranque de uno le rompe las tablas al otro.
      ddl-auto: validate
    open-in-view: false     # evita que la sesión JPA quede abierta en la capa de presentación
    properties:
      hibernate:
        format_sql: true
        # Las entidades de este módulo viven en su schema, el mismo que gobierna Flyway.
        default_schema: charging

  # --- Broker ---
  # El de docker-compose. Reservas publica ahí los avisos para Notificaciones.
  #
  # Si el broker no está, el artefacto arranca y reserva igual: la conexión se intenta recién al
  # publicar, y si falla el aviso queda en el log. Por eso `pnpm dev` no necesita Docker.
  #
  # Sin `mode`, igual que en ecopedia-async: los tests usan el broker embebido porque el servidor
  # de Artemis está solo en su classpath.
  artemis:
    broker-url: ${ECOPEDIA_BROKER_URL:tcp://localhost:61616}
    user: ${ECOPEDIA_BROKER_USER:ecopedia}
    password: ${ECOPEDIA_BROKER_PASSWORD}     # sin valor por defecto: sale del .env

server:
  port: ${SERVER_PORT:8082}

ecopedia:
  notifications:
    # La cola de avisos. El nombre tiene que coincidir con el que escucha ecopedia-async.
    queue: notifications.dispatch

  jwt:
    # El MISMO secreto que ecopedia-core. Core firma el token al hacer login y este artefacto
    # lo valida: con secretos distintos, todo token llega con firma inválida y cada operación
    # de Reservas responde 403 aunque el usuario esté logueado.
    #
    # Sin valor por defecto, por lo mismo que en core: ver el comentario de allá. Los perfiles
    # dev y local traen el mismo valor de desarrollo que core, así `pnpm dev` funciona sin .env.
    secret: ${ECOPEDIA_JWT_SECRET}

  core:
    # Dónde está ecopedia-core. Reservas le pregunta por el conector antes de retener un slot.
    # Sale de una variable por lo mismo que la base y el broker: mudar de ambiente es cambiar
    # valores, no código.
    url: ${ECOPEDIA_CORE_URL:http://localhost:8081}

  booking:
    # Cuánto dura una retención de slot antes de vencer sola (ISO-8601: PT10M = 10 minutos).
    # Es el tiempo que tiene el conductor para confirmar. Ver ARQUITECTURA_ECOPEDIA.md §2.3.
    hold-ttl: ${ECOPEDIA_BOOKING_HOLD_TTL:PT10M}

    # Cuánto puede durar una reserva y con cuánta anticipación se puede pedir.
    #
    # Son topes de negocio, no detalles técnicos: sin ellos un solo pedido —o un front con un
    # error de fechas— deja un conector bloqueado por años, y la regla de RF08 lo haría cumplir
    # al pie de la letra. Los valores de acá son los que usamos para la demo; el operador real
    # los fija por variable de entorno sin tocar código.
    max-window: ${ECOPEDIA_BOOKING_MAX_WINDOW:PT4H}
    max-horizon: ${ECOPEDIA_BOOKING_MAX_HORIZON:P30D}

---
# Perfil de desarrollo: base en memoria, para levantar el módulo sin PostgreSQL instalado.
# Las demos de las entregas corren sobre PostgreSQL, no sobre H2.
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    # MODE=PostgreSQL hace que H2 acepte la sintaxis de PostgreSQL, así las mismas
    # migraciones corren en los dos motores y el esquema no se bifurca.
    #
    # DATABASE_TO_LOWER=TRUE es obligatorio, por lo mismo que en ecopedia-core: sin eso H2
    # guarda en MAYÚSCULAS los identificadores que la migración no entrecomilla, Hibernate los
    # busca en minúscula como PostgreSQL, y el arranque muere con
    # "Schema-validation: missing table [bookings]".
    url: jdbc:h2:mem:ecopedia-charging;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true         # http://localhost:8082/h2-console

  # Sin valor por defecto en el perfil de arriba; acá vacío, así los tests y un `pnpm dev` sin
  # .env arrancan igual. Contra el broker de docker-compose la contraseña sale del .env.
  artemis:
    password: ${ECOPEDIA_BROKER_PASSWORD:}

# El secreto de desarrollo. Existe solo en los perfiles dev y local: sin perfil (`pnpm demo`,
# el JAR) no hay valor por defecto y el proceso no arranca sin ECOPEDIA_JWT_SECRET.
ecopedia:
  jwt:
    secret: ${ECOPEDIA_JWT_SECRET:ecopedia-dev-only-secret-never-use-in-shared-environments}

---
# Perfil local: la base de este integrante, en un archivo de su propio disco.
#
# El gemelo del perfil `local` de ecopedia-core, y por los mismos motivos: es el perfil que
# levanta `pnpm dev` y los datos sobreviven a bajar y volver a levantar. Las reservas que
# retenés siguen estando en el arranque siguiente.
#
# **Archivo propio, no el de core.** Cada módulo gobierna su esquema y su propia tabla
# flyway_schema_history, igual que en PostgreSQL cada uno tiene su schema. Compartir archivo
# sería el mismo error que compartir el historial de Flyway: cada módulo vería las
# migraciones del otro como aplicadas pero ausentes y ninguno arrancaría.
#
# **Por qué no es `dev` con otra URL:** los tests de este módulo también declaran
# @ActiveProfiles("dev") y necesitan una base vacía por corrida.
spring:
  config:
    activate:
      on-profile: local

  datasource:
    # h2:file, no h2:mem. Queda en backend/ecopedia-charging/data/, que está en el .gitignore.
    #
    # DATABASE_TO_LOWER=TRUE es obligatorio, por lo mismo que en el perfil `dev`: sin eso el
    # arranque muere con "Schema-validation: missing table [bookings]".
    #
    # Una migración ya aplicada no se puede editar: Flyway aborta por checksum. El reset de
    # este ambiente es borrar la carpeta data/ del módulo. Está en el README.
    url: jdbc:h2:file:${ECOPEDIA_CHARGING_LOCAL_DB:./data/ecopedia-charging};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true         # http://localhost:8082/h2-console

  # Sin valor por defecto en el perfil de arriba; acá vacío, así los tests y un `pnpm dev` sin
  # .env arrancan igual. Contra el broker de docker-compose la contraseña sale del .env.
  artemis:
    password: ${ECOPEDIA_BROKER_PASSWORD:}

# El secreto de desarrollo. Existe solo en los perfiles dev y local: sin perfil (`pnpm demo`,
# el JAR) no hay valor por defecto y el proceso no arranca sin ECOPEDIA_JWT_SECRET.
ecopedia:
  jwt:
    secret: ${ECOPEDIA_JWT_SECRET:ecopedia-dev-only-secret-never-use-in-shared-environments}
