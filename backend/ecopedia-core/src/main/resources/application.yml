spring:
  application:
    name: ecopedia-core

  # Perfil por defecto: PostgreSQL, que es el motor sobre el que corren las demos.
  datasource:
    url: ${ECOPEDIA_DB_URL:jdbc:postgresql://localhost:5432/ecopedia}
    username: ${ECOPEDIA_DB_USER:ecopedia}
    password: ${ECOPEDIA_DB_PASSWORD}         # sin valor por defecto: sale del .env

  # El esquema lo gobierna Flyway. Los archivos van en src/main/resources/db/migration
  # y se nombran V<AAAAMMDD><HHmm>__descripcion.sql — con timestamp, NUNCA con V1/V2/V3.
  #
  # Con numeración secuencial, dos personas escriben "V3__" la misma tarde y chocan.
  # Con timestamp el choque es imposible por construcción. Ver README, "Migraciones".
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Un schema por artefacto, dentro de la misma base.
    #
    # Sin esto, core y charging compartirían la tabla flyway_schema_history: cada uno vería
    # las migraciones del otro como "aplicadas pero ausentes" y ninguno de los dos arrancaría.
    # Flyway crea el schema si no existe.
    schemas: core
    # Todavía no hay migraciones: sin esto, Flyway aborta al no encontrar ninguna.
    fail-on-missing-locations: false

  jpa:
    hibernate:
      # 'validate', no 'update': Hibernate verifica que las entidades coincidan con lo que
      # creó Flyway, pero no toca el esquema. Con 'update' y cuatro personas contra la misma
      # base, el arranque de uno le rompe las tablas al otro.
      ddl-auto: validate
    open-in-view: false     # evita que la sesión JPA quede abierta en la capa de presentación
    properties:
      hibernate:
        format_sql: true
        # Las entidades de este módulo viven en su schema, el mismo que gobierna Flyway.
        default_schema: core

server:
  port: ${SERVER_PORT:8081}

ecopedia:
  jwt:
    # El secreto con el que se firman los tokens. Entra SOLO por variable de entorno: sin perfil
    # no hay valor por defecto, y si falta, el arranque aborta con "Could not resolve placeholder
    # 'ECOPEDIA_JWT_SECRET'". Es a propósito: un valor escrito acá sería público, porque el repo
    # lo es, y con él cualquiera podría firmarse un token de ADMIN. Los perfiles dev y local, más
    # abajo, traen uno de desarrollo. `pnpm env:init` genera el de verdad en el .env.
    #
    # Lo comparte con ecopedia-charging, que valida los tokens que este artefacto emite: los
    # dos tienen que leer la MISMA variable, o Reservas rechaza a todo el mundo.
    #
    # Cambiarlo invalida los tokens ya emitidos: en pantalla se ve como "me deslogueó solo".
    secret: ${ECOPEDIA_JWT_SECRET}

---
# Perfil de desarrollo: base en memoria, para levantar el módulo sin PostgreSQL instalado.
# Las demos de las entregas corren sobre PostgreSQL, no sobre H2.
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    # MODE=PostgreSQL hace que H2 acepte la sintaxis de PostgreSQL, así las mismas
    # migraciones corren en los dos motores y el esquema no se bifurca.
    #
    # DATABASE_TO_LOWER=TRUE no es decoración: sin eso H2 guarda en MAYÚSCULAS todo
    # identificador que la migración no entrecomilla, mientras que Flyway sí entrecomilla el
    # nombre del schema. Queda un schema "core" con tablas "STATIONS" y "CONNECTORS", y
    # Hibernate —que busca en minúscula, como PostgreSQL— aborta el arranque con
    # "Schema-validation: missing table". Compila igual: falla recién al levantar.
    url: jdbc:h2:mem:ecopedia-core;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true         # http://localhost:8081/h2-console

# El secreto de desarrollo. Existe solo en los perfiles dev y local: sin perfil (`pnpm demo`,
# el JAR) no hay valor por defecto y el proceso no arranca sin ECOPEDIA_JWT_SECRET.
ecopedia:
  jwt:
    secret: ${ECOPEDIA_JWT_SECRET:ecopedia-dev-only-secret-never-use-in-shared-environments}

---
# Perfil local: la base de este integrante, en un archivo de su propio disco.
#
# Es el perfil del día a día, el que levanta `pnpm dev`. La diferencia con `dev` es una sola
# y es la que importa: acá los datos SOBREVIVEN a bajar y volver a levantar el proyecto. El
# usuario que te registraste sigue estando, y al operador lo promovés a CPO una sola vez.
#
# **Por qué es un perfil aparte y no `dev` apuntando a un archivo.** Los tests declaran
# @ActiveProfiles("dev") y necesitan una base vacía en cada corrida. Compartiendo perfil,
# los datos de los tests aparecerían en tu navegador y —mucho peor— los tuyos entrarían a
# los tests: una estación cargada a mano hace fallar a TerminalApiTest en tu máquina
# mientras CI pasa en verde, porque CI clona limpio. Son dos necesidades opuestas.
#
# **El esquema no se bifurca por usar otro motor.** Lo construyen las mismas migraciones de
# Flyway que corren contra PostgreSQL: el archivo .sql es el contrato y la base de cada uno
# se arma sola a partir de él. Por eso los datos son propios pero el esquema es el mismo.
spring:
  config:
    activate:
      on-profile: local

  datasource:
    # h2:file, no h2:mem. El archivo queda en backend/ecopedia-core/data/ y esa carpeta está
    # en el .gitignore: cada uno tiene sus datos y nadie ve los del otro.
    #
    # MODE=PostgreSQL y DATABASE_TO_LOWER=TRUE van por exactamente lo mismo que en el perfil
    # `dev` — ver el comentario de allá, que explica por qué el segundo no es decoración.
    #
    # Ojo con la contracara de que los datos persistan: una migración YA APLICADA no se puede
    # editar. Flyway ve el checksum cambiado y aborta el arranque. Se arregla borrando la
    # carpeta data/ del módulo, que es el reset de este ambiente. Está en el README.
    url: jdbc:h2:file:${ECOPEDIA_CORE_LOCAL_DB:./data/ecopedia-core};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true         # http://localhost:8081/h2-console

# El secreto de desarrollo. Existe solo en los perfiles dev y local: sin perfil (`pnpm demo`,
# el JAR) no hay valor por defecto y el proceso no arranca sin ECOPEDIA_JWT_SECRET.
ecopedia:
  jwt:
    secret: ${ECOPEDIA_JWT_SECRET:ecopedia-dev-only-secret-never-use-in-shared-environments}
