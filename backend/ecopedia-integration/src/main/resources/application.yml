spring:
  application:
    name: ecopedia-integration

  # Desde ECO-26 este módulo tiene tabla propia: los medios de pago del conductor (RF02).
  # Antes no la tenía y el bloque de abajo no existía; el comentario que estaba en su lugar
  # decía que, si eso cambiaba, había que copiar el datasource de core. Es lo que se hizo.
  datasource:
    url: ${ECOPEDIA_DB_URL:jdbc:postgresql://localhost:5432/ecopedia}
    username: ${ECOPEDIA_DB_USER:ecopedia}
    password: ${ECOPEDIA_DB_PASSWORD}         # sin valor por defecto: sale del .env

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Un schema por artefacto, dentro de la misma base.
    #
    # Sin esto, core e integration compartirían la tabla flyway_schema_history: cada uno vería
    # las migraciones del otro como "aplicadas pero ausentes" y ninguno de los dos arrancaría.
    # Flyway crea el schema si no existe.
    #
    # Efecto secundario que conviene tener presente: las migraciones de este módulo no se
    # ordenan contra las de core. Los timestamps del nombre siguen siendo la convención, pero
    # acá sirven para ordenar entre nosotros, no contra el otro artefacto.
    schemas: integration

  jpa:
    hibernate:
      # 'validate', no 'update'. Mismo motivo que en core: el esquema lo crea Flyway.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_schema: integration

server:
  port: ${SERVER_PORT:8083}

# --- Sistemas externos simulados ---
# La pasarela todavía no existe como proceso: PaymentGatewayPort corre hoy contra una
# implementación local. Esta dirección queda declarada para cuando se levante. Ver §3.2.
ecopedia:
  payment-gateway:
    url: ${ECOPEDIA_PAYMENT_GATEWAY_URL:http://localhost:8091}
  power-grid:
    url: ${ECOPEDIA_POWER_GRID_URL:http://localhost:8092/ws}

  # La MISMA clave con la que Usuarios firma en ecopedia-core. Si las dos no coinciden, este
  # módulo rechaza todos los tokens y la pantalla de tarjetas queda inaccesible sin ningún
  # error que lo explique. Sin valor por defecto, por lo mismo que en core: ver el comentario
  # de allá.
  jwt:
    secret: ${ECOPEDIA_JWT_SECRET}

---
# Perfil de desarrollo: base en memoria, para levantar el módulo sin PostgreSQL instalado.
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    # Mismos parámetros que core, y por los mismos motivos: MODE=PostgreSQL para que las
    # migraciones no se bifurquen, y DATABASE_TO_LOWER para que Hibernate encuentre las
    # tablas que Flyway creó dentro de un schema entrecomillado.
    #
    # Base distinta de la de core (ecopedia-integration, no ecopedia-core): son dos procesos
    # con dos H2 en memoria, cada una con su schema.
    url: jdbc:h2:mem:ecopedia-integration;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true         # http://localhost:8083/h2-console

# El secreto de desarrollo. Existe solo en los perfiles dev y local: sin perfil (`pnpm demo`,
# el JAR) no hay valor por defecto y el proceso no arranca sin ECOPEDIA_JWT_SECRET.
ecopedia:
  jwt:
    secret: ${ECOPEDIA_JWT_SECRET:ecopedia-dev-only-secret-never-use-in-shared-environments}

---
# Perfil local: la base de este integrante, en un archivo de su propio disco.
#
# El gemelo del perfil `local` de ecopedia-core y de ecopedia-charging, y por los mismos
# motivos: es el perfil que levanta `pnpm dev` y los datos sobreviven a bajar y volver a
# levantar. Las tarjetas que cargaste siguen estando en el arranque siguiente, que es
# justamente lo que hace usable la pantalla de medios de pago mientras se la desarrolla.
#
# **Archivo propio, no el de core ni el de charging.** Cada módulo gobierna su esquema y su
# propia tabla flyway_schema_history, igual que en PostgreSQL cada uno tiene su schema.
# Compartir archivo sería el mismo error que compartir el historial de Flyway: cada módulo
# vería las migraciones del otro como aplicadas pero ausentes y ninguno arrancaría.
#
# **Por qué no es `dev` con otra URL:** los tests de este módulo también declaran
# @ActiveProfiles("dev") y necesitan una base vacía por corrida.
spring:
  config:
    activate:
      on-profile: local

  datasource:
    # h2:file, no h2:mem. Queda en backend/ecopedia-integration/data/, que está en el
    # .gitignore.
    #
    # DATABASE_TO_LOWER=TRUE es obligatorio, por lo mismo que en el perfil `dev`: sin eso el
    # arranque muere con "Schema-validation: missing table [payment_methods]".
    #
    # Una migración ya aplicada no se puede editar: Flyway aborta por checksum. El reset de
    # este ambiente es borrar la carpeta data/ del módulo. Está en el README.
    url: jdbc:h2:file:${ECOPEDIA_INTEGRATION_LOCAL_DB:./data/ecopedia-integration};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true         # http://localhost:8083/h2-console

# El secreto de desarrollo. Existe solo en los perfiles dev y local: sin perfil (`pnpm demo`,
# el JAR) no hay valor por defecto y el proceso no arranca sin ECOPEDIA_JWT_SECRET.
ecopedia:
  jwt:
    secret: ${ECOPEDIA_JWT_SECRET:ecopedia-dev-only-secret-never-use-in-shared-environments}
