spring:
  application:
    name: ecopedia-integration

  # Este módulo consume un servicio SOAP, no publica ninguno. Con spring-ws-core en el classpath,
  # Spring Boot levantaría igual un MessageDispatcherServlet vacío en /services; se excluye.
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.webservices.WebServicesAutoConfiguration

  # Desde ECO-26 este módulo tiene tabla propia: los medios de pago del conductor (RF02).
  # Antes no la tenía y el bloque de abajo no existía; el comentario que estaba en su lugar
  # decía que, si eso cambiaba, había que copiar el datasource de core. Es lo que se hizo.
  datasource:
    url: ${ECOPEDIA_DB_URL:jdbc:postgresql://localhost:5432/ecopedia}
    username: ${ECOPEDIA_DB_USER:ecopedia}
    password: ${ECOPEDIA_DB_PASSWORD}         # sin valor por defecto: sale del .env

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Un schema por artefacto, dentro de la misma base.
    #
    # Sin esto, core e integration compartirían la tabla flyway_schema_history: cada uno vería
    # las migraciones del otro como "aplicadas pero ausentes" y ninguno de los dos arrancaría.
    # Flyway crea el schema si no existe.
    #
    # Efecto secundario que conviene tener presente: las migraciones de este módulo no se
    # ordenan contra las de core. Los timestamps del nombre siguen siendo la convención, pero
    # acá sirven para ordenar entre nosotros, no contra el otro artefacto.
    schemas: integration

  jpa:
    hibernate:
      # 'validate', no 'update'. Mismo motivo que en core: el esquema lo crea Flyway.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_schema: integration

  # --- Broker ---
  # El de docker-compose. Pagos publica ahí los avisos de las deudas para Notificaciones (ECO-62),
  # en la misma cola que Reservas. Si el broker no está, el artefacto arranca y cobra igual: el aviso
  # queda pendiente y se reenvía cuando vuelve (ver JmsDebtEventPublisher).
  #
  # Sin `mode`, igual que en charging: los tests usan el broker embebido porque el servidor de Artemis
  # está solo en su classpath.
  artemis:
    broker-url: ${ECOPEDIA_BROKER_URL:tcp://localhost:61616}
    user: ${ECOPEDIA_BROKER_USER:ecopedia}
    password: ${ECOPEDIA_BROKER_PASSWORD}     # sin valor por defecto: sale del .env

server:
  port: ${SERVER_PORT:8083}

# El contrato OpenAPI (QA-25), en /v3/api-docs y sin sesión. Solo las rutas de /api: las de
# /internal son entre módulos y no forman parte del contrato. JSON por defecto: sin esto springdoc
# declara las respuestas como */* y el contrato no diría qué devuelve cada operación.
springdoc:
  # OpenAPI 3.0 y no la 3.1 que trae springdoc 2.8: OpenApiConfig marca los campos opcionales con
  # nullable, que en 3.1 ya no existe.
  api-docs:
    version: openapi_3_0
  paths-to-match: /api/**
  default-produces-media-type: application/json
  default-consumes-media-type: application/json

# --- Sistemas externos simulados ---
# La pasarela corre como proceso aparte (simulation/payment-gateway, 8086) y Pagos le habla por
# REST con PaymentGatewayRestClient. Ver ARQUITECTURA §3.2.
ecopedia:
  payment-gateway:
    url: ${ECOPEDIA_PAYMENT_GATEWAY_URL:http://localhost:8086}
    # La clave con la que Pagos se presenta ante la pasarela. La misma variable la lee la
    # pasarela. Sin valor por defecto: sin perfil, el módulo no arranca sin el .env.
    access-token: ${ECOPEDIA_PAYMENT_GATEWAY_ACCESS_TOKEN}
    # Si la pasarela no conecta en 2 s o no contesta en 5 s, se la da por caída: el conductor
    # recibe un "probá de nuevo en un momento" en vez de una pantalla colgada.
    connect-timeout: 2s
    read-timeout: 5s
    # El circuit breaker (ECO-68): si de los últimos 10 pedidos, con al menos 5, la mitad no tuvo
    # respuesta, se deja de llamar a la pasarela durante 30 s y se contesta "no disponible" al
    # instante; después se prueba con 3 pedidos. Un rechazo de la tarjeta no cuenta como falla.
    circuit-breaker:
      sliding-window-size: 10
      minimum-calls: 5
      failure-rate-percent: 50
      wait-in-open-state: 30s
      calls-in-half-open-state: 3
  # La distribuidora corre como proceso aparte (simulation/power-grid, 8087) y RedEléctrica le habla
  # por SOAP con PowerGridWsClient. Ver ARQUITECTURA §3.1.
  power-grid:
    url: ${ECOPEDIA_POWER_GRID_URL:http://localhost:8087/ws}
    # El UsernameToken de WS-Security. Las mismas variables las lee la distribuidora. La
    # contraseña, sin valor por defecto: sin perfil, el módulo no arranca sin el .env.
    username: ${ECOPEDIA_POWER_GRID_USERNAME:ecopedia}
    password: ${ECOPEDIA_POWER_GRID_PASSWORD}
    # Los mismos que con la pasarela, y sin reintentos: ver PowerGridClientConfig.
    connect-timeout: 2s
    read-timeout: 5s
    # El mismo circuit breaker que la pasarela. Abierto, la carga sale a potencia normal sin
    # esperar a la distribuidora. Un nodo desconocido no cuenta como falla.
    circuit-breaker:
      sliding-window-size: 10
      minimum-calls: 5
      failure-rate-percent: 50
      wait-in-open-state: 30s
      calls-in-half-open-state: 3

  # La MISMA clave con la que Usuarios firma en ecopedia-core. Si las dos no coinciden, este
  # módulo rechaza todos los tokens y la pantalla de tarjetas queda inaccesible sin ningún
  # error que lo explique. Sin valor por defecto, por lo mismo que en core: ver el comentario
  # de allá.
  jwt:
    secret: ${ECOPEDIA_JWT_SECRET}

  # La clave con la que los otros artefactos de Ecopedia llaman a las rutas /internal/** (hoy, la
  # consulta a la distribuidora de SesionesDeCarga). No es la de un usuario: es la del servicio. La
  # misma variable la lee ecopedia-charging. Sin valor por defecto, por lo mismo que el secreto del
  # JWT. Ver InternalTokenFilter.
  internal:
    token: ${ECOPEDIA_INTERNAL_TOKEN}

  # Reservas (ecopedia-charging), para anular las reservas de una cuenta marcada por deuda (ECO-62).
  # Va por su ruta interna con la misma clave de servicio de arriba.
  charging:
    url: ${ECOPEDIA_CHARGING_URL:http://localhost:8082}

  # La deuda del conductor (ECO-62, decidido por Manuel el 20/11): después del cobro que falló, tres
  # reintentos cada 20 minutos; si fallan los tres, la cuenta queda marcada. El barrido mira cada
  # minuto qué reintentos tocan.
  notifications:
    # La cola de avisos. El nombre tiene que coincidir con el que escucha ecopedia-async.
    queue: notifications.dispatch
    # Cada cuánto se reintentan los avisos que no salieron porque el broker no estaba.
    retry-interval: ${ECOPEDIA_NOTIFICATIONS_RETRY_INTERVAL:PT15S}

  payments:
    debt:
      retry-interval: ${ECOPEDIA_DEBT_RETRY_INTERVAL:PT20M}
      max-retries: ${ECOPEDIA_DEBT_MAX_RETRIES:3}
      sweep-interval: ${ECOPEDIA_DEBT_SWEEP_INTERVAL:PT1M}

---
# Perfil de desarrollo: base en memoria, para levantar el módulo sin PostgreSQL instalado.
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    # Mismos parámetros que core, y por los mismos motivos: MODE=PostgreSQL para que las
    # migraciones no se bifurquen, y DATABASE_TO_LOWER para que Hibernate encuentre las
    # tablas que Flyway creó dentro de un schema entrecomillado.
    #
    # Base distinta de la de core (ecopedia-integration, no ecopedia-core): son dos procesos
    # con dos H2 en memoria, cada una con su schema.
    url: jdbc:h2:mem:ecopedia-integration;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true         # http://localhost:8083/h2-console

  # Sin valor por defecto en el perfil de arriba; acá vacío, así los tests y un `pnpm dev` sin
  # .env arrancan igual. Contra el broker de docker-compose la contraseña sale del .env.
  artemis:
    password: ${ECOPEDIA_BROKER_PASSWORD:}

# El secreto de desarrollo. Existe solo en los perfiles dev y local: sin perfil (`pnpm demo`,
# el JAR) no hay valor por defecto y el proceso no arranca sin ECOPEDIA_JWT_SECRET.
ecopedia:
  jwt:
    secret: ${ECOPEDIA_JWT_SECRET:ecopedia-dev-only-secret-never-use-in-shared-environments}
  payment-gateway:
    access-token: ${ECOPEDIA_PAYMENT_GATEWAY_ACCESS_TOKEN:ecopedia-dev-only-gateway-token}
  power-grid:
    password: ${ECOPEDIA_POWER_GRID_PASSWORD:ecopedia-dev-only-power-grid-password}
  internal:
    token: ${ECOPEDIA_INTERNAL_TOKEN:ecopedia-dev-only-internal-token}

---
# Perfil local: la base de este integrante, en un archivo de su propio disco.
#
# El gemelo del perfil `local` de ecopedia-core y de ecopedia-charging, y por los mismos
# motivos: es el perfil que levanta `pnpm dev` y los datos sobreviven a bajar y volver a
# levantar. Las tarjetas que cargaste siguen estando en el arranque siguiente, que es
# justamente lo que hace usable la pantalla de medios de pago mientras se la desarrolla.
#
# **Archivo propio, no el de core ni el de charging.** Cada módulo gobierna su esquema y su
# propia tabla flyway_schema_history, igual que en PostgreSQL cada uno tiene su schema.
# Compartir archivo sería el mismo error que compartir el historial de Flyway: cada módulo
# vería las migraciones del otro como aplicadas pero ausentes y ninguno arrancaría.
#
# **Por qué no es `dev` con otra URL:** los tests de este módulo también declaran
# @ActiveProfiles("dev") y necesitan una base vacía por corrida.
spring:
  config:
    activate:
      on-profile: local

  datasource:
    # h2:file, no h2:mem. Queda en backend/ecopedia-integration/data/, que está en el
    # .gitignore.
    #
    # DATABASE_TO_LOWER=TRUE es obligatorio, por lo mismo que en el perfil `dev`: sin eso el
    # arranque muere con "Schema-validation: missing table [payment_methods]".
    #
    # Una migración ya aplicada no se puede editar: Flyway aborta por checksum. El reset de
    # este ambiente es borrar la carpeta data/ del módulo. Está en el README.
    url: jdbc:h2:file:${ECOPEDIA_INTEGRATION_LOCAL_DB:./data/ecopedia-integration};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true         # http://localhost:8083/h2-console

  # Sin valor por defecto en el perfil de arriba; acá vacío, así los tests y un `pnpm dev` sin
  # .env arrancan igual. Contra el broker de docker-compose la contraseña sale del .env.
  artemis:
    password: ${ECOPEDIA_BROKER_PASSWORD:}

# El secreto de desarrollo. Existe solo en los perfiles dev y local: sin perfil (`pnpm demo`,
# el JAR) no hay valor por defecto y el proceso no arranca sin ECOPEDIA_JWT_SECRET.
ecopedia:
  jwt:
    secret: ${ECOPEDIA_JWT_SECRET:ecopedia-dev-only-secret-never-use-in-shared-environments}
  payment-gateway:
    access-token: ${ECOPEDIA_PAYMENT_GATEWAY_ACCESS_TOKEN:ecopedia-dev-only-gateway-token}
  power-grid:
    password: ${ECOPEDIA_POWER_GRID_PASSWORD:ecopedia-dev-only-power-grid-password}
  internal:
    token: ${ECOPEDIA_INTERNAL_TOKEN:ecopedia-dev-only-internal-token}
