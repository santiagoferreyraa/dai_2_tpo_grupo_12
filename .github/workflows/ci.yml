# Integración continua.
#
# Existe para que un merge roto se detecte en el PR y no lo herede el resto del equipo.
# Somos cuatro: si alguien mergea algo que no compila o que no está formateado, los otros
# tres se lo llevan puesto en su próximo rebase.
#
# Los jobs corren en paralelo y son independientes:
# - `backend` y `frontend`: compilan, testean y chequean formato. `backend` además mide la
#   cobertura con JaCoCo (QA-22) y la muestra en el resumen del run.
# - `api` (QA-05): levanta los cuatro backends y los tres simuladores y les corre la colección
#   de Postman con Newman.
# - `sonar` (QA-17): análisis estático y Quality Gate en SonarCloud. Se saltea solo mientras no
#   exista el secreto SONAR_TOKEN (ver qa/README.md).

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Si se pushea de nuevo a un PR, cancela la corrida anterior en vez de encolarla.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Preparar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # 'verify' compila, corre los tests y ejecuta spotless:check.
      # Si alguien no corrió "mvn spotless:apply", falla acá.
      - name: Compilar, testear y chequear formato
        run: mvn -B verify

      # QA-22: la cobertura de dominio y servicio, en el resumen del run. No bloquea: los
      # umbrales viven en el pom (coverage.lines.minimum y coverage.branches.minimum).
      - name: Resumen de cobertura
        if: always()
        run: python3 qa/ci/coverage-summary.py

      - name: Guardar el reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco
          path: |
            backend/*/target/site/jacoco/
            simulation/*/target/site/jacoco/
          if-no-files-found: ignore

  frontend:
    name: Frontend (pnpm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      # Va antes de setup-node a propósito: el caché de Node necesita que pnpm ya exista
      # para poder preguntarle dónde tiene su store.
      #
      # La versión sale del campo "packageManager" de frontend/package.json, así que se
      # fija en un solo lugar y no puede desincronizarse de la que usa cada máquina.
      - name: Preparar pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # '--frozen-lockfile' instala exactamente lo que dice pnpm-lock.yaml y falla si el
      # lock quedó desincronizado de package.json — que es justo el síntoma de un merge
      # mal resuelto del lock. En CI ya es el comportamiento por defecto, pero explícito
      # se lee mejor y no depende de que eso no cambie.
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Chequear formato
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

  # QA-17 (ECO-167): análisis estático y Quality Gate en SonarCloud (condición G3).
  #
  # Necesita el secreto SONAR_TOKEN, que solo puede cargar quien administra el repo: mientras no
  # esté, el job termina en verde sin analizar nada y lo avisa. Organización y proyecto salen de
  # las variables SONAR_ORGANIZATION y SONAR_PROJECT_KEY del repo; si no están, se usan los
  # nombres que SonarCloud pone por defecto al importar el repo.
  #
  # `qualitygate.wait` hace que el job espere el veredicto y quede en rojo si el Quality Gate no
  # aprueba. No es un check obligatorio de main: un gate en rojo se trata como defecto, no
  # frena los merges.
  sonar:
    name: Sonar (Quality Gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: ¿Está configurado SonarCloud?
        id: config
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::notice title=SonarCloud sin configurar::Falta el secreto SONAR_TOKEN. Ver qa/README.md, sección SonarCloud."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.config.outputs.enabled == 'true'
        with:
          fetch-depth: 0     # Sonar usa el historial para saber qué código es nuevo

      - name: Preparar JDK 21
        if: steps.config.outputs.enabled == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Testear, medir cobertura y analizar
        if: steps.config.outputs.enabled == 'true'
        run: |
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization="${{ vars.SONAR_ORGANIZATION || 'santiagoferreyraa' }}" \
            -Dsonar.projectKey="${{ vars.SONAR_PROJECT_KEY || 'santiagoferreyraa_dai_2_tpo_grupo_12' }}" \
            -Dsonar.qualitygate.wait=true

  # QA-05 (ECO-155): la colección de API, contra el sistema corriendo de verdad.
  #
  # Los cuatro backends y los tres simuladores con el perfil dev (H2 en memoria) y un Artemis real como servicio del
  # runner, así el aviso de la reserva viaja por la cola de punta a punta. La contraseña del
  # broker sale del número de corrida: no es un secreto, el contenedor muere con el job.
  #
  # Los usuarios ADMIN y CPO los crea qa/ci/start-stack.sh con contraseñas al azar de esa corrida.
  api:
    name: API (Newman)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ECOPEDIA_BROKER_PASSWORD: qa-${{ github.run_id }}

    services:
      artemis:
        image: apache/activemq-artemis:2.42.0
        env:
          ARTEMIS_USER: ecopedia
          ARTEMIS_PASSWORD: qa-${{ github.run_id }}
        ports:
          - 61616:61616

    steps:
      - uses: actions/checkout@v4

      - name: Preparar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Sin tests: ya los corre el job backend. Acá solo hacen falta los JAR.
      - name: Construir los JAR
        run: mvn -B -Dmaven.test.skip=true -Dspotless.check.skip=true package

      - name: Levantar backends y simuladores
        run: |
          python3 -m pip install --quiet --user --break-system-packages bcrypt
          bash qa/ci/start-stack.sh

      - name: Correr la colección de API
        run: |
          npx --yes newman@6 run qa/postman/ecopedia.postman_collection.json \
            --env-var coreUrl=http://localhost:8081 \
            --env-var chargingUrl=http://localhost:8082 \
            --env-var integrationUrl=http://localhost:8083 \
            --env-var asyncUrl=http://localhost:8084 \
            --env-var adminEmail="$QA_ADMIN_EMAIL" \
            --env-var adminPassword="$QA_ADMIN_PASSWORD" \
            --env-var cpoEmail="$QA_CPO_EMAIL" \
            --env-var cpoPassword="$QA_CPO_PASSWORD" \
            --reporters cli,junit \
            --reporter-junit-export qa/newman/results.xml

      - name: Guardar resultados y logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman
          path: |
            qa/newman/
            qa/ci/logs/

      - name: Bajar los backends
        if: always()
        run: bash qa/ci/stop-stack.sh
