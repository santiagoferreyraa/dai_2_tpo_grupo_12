# Integración continua.
#
# Existe para que un merge roto se detecte en el PR y no lo herede el resto del equipo.
# Somos cuatro: si alguien mergea algo que no compila o que no está formateado, los otros
# tres se lo llevan puesto en su próximo rebase.
#
# Los seis jobs corren en paralelo y son independientes. `sonar` es el de QA-17: SonarCloud y su Quality Gate. `api` es el de QA-05: levanta los cuatro backends y los tres simuladores
# y les corre la colección de Postman con Newman. `agent` es el del asistente del chat (agent/). `e2e`
# es el de QA-20: los escenarios de punta a punta en un navegador.
#
# Ojo: el nombre de cada job es un `context` del ruleset de main. "Agent (Node)", "E2E (Playwright)"
# y "Sonar (Quality Gate)" NO están en el ruleset (no bloquean el merge); si se los quiere obligatorios, los agrega SantiagoF
# en Settings.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Si se pushea de nuevo a un PR, cancela la corrida anterior en vez de encolarla.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Preparar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # 'verify' compila, corre los tests y ejecuta spotless:check.
      # Si alguien no corrió "mvn spotless:apply", falla acá.
      # También corre los *IT (QA-24): PostgreSQL y Artemis en contenedores, con el Docker del runner.
      - name: Compilar, testear y chequear formato
        run: mvn -B verify

      - name: Publicar reporte de cobertura (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco
          path: backend/*/target/site/jacoco/

  frontend:
    name: Frontend (pnpm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      # Va antes de setup-node a propósito: el caché de Node necesita que pnpm ya exista
      # para poder preguntarle dónde tiene su store.
      #
      # La versión sale del campo "packageManager" de frontend/package.json, así que se
      # fija en un solo lugar y no puede desincronizarse de la que usa cada máquina.
      - name: Preparar pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # '--frozen-lockfile' instala exactamente lo que dice pnpm-lock.yaml y falla si el
      # lock quedó desincronizado de package.json — que es justo el síntoma de un merge
      # mal resuelto del lock. En CI ya es el comportamiento por defecto, pero explícito
      # se lee mejor y no depende de que eso no cambie.
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Chequear formato
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

  # El asistente del chat: Node con TypeScript, sin compilar (Node 24 le saca los tipos al correr).
  # Mismos pasos que el front: dependencias exactas, formato, tipos y los tests, que usan un modelo
  # guionado y no salen a la red ni piden la clave de Gemini.
  agent:
    name: Agent (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent

    steps:
      - uses: actions/checkout@v4

      # Antes de setup-node, por lo mismo que en el front. La versión sale de agent/package.json.
      - name: Preparar pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: agent/package.json

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: agent/pnpm-lock.yaml

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Chequear formato
        run: pnpm run format:check

      - name: Tipos
        run: pnpm run typecheck

      - name: Tests
        run: pnpm test

  # QA-17: análisis estático y Quality Gate en SonarCloud (proyecto
  # santiagoferreyraa_dai_2_tpo_grupo_12, con el Automatic Analysis apagado: lo analiza este job).
  #
  # Va aparte de `backend` para no alargarlo ni mezclar sus checks: corre el mismo `mvn verify`
  # (así Sonar recibe la cobertura de JaCoCo) y después el escáner, que espera el Quality Gate y
  # pone el job en rojo si no pasa. Analiza los 4 backends y los 3 simuladores (los módulos Maven).
  #
  # Sin SONAR_TOKEN (un PR desde un fork, por ejemplo) el job avisa y termina en verde sin analizar.
  sonar:
    name: Sonar (Quality Gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: ¿Está configurado SonarCloud?
        id: config
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::notice title=SonarCloud sin configurar::Falta el secreto SONAR_TOKEN; el análisis no corre."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.config.outputs.enabled == 'true'
        with:
          fetch-depth: 0     # Sonar usa el historial para saber qué código es nuevo

      - name: Preparar JDK 21
        if: steps.config.outputs.enabled == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Testear, medir cobertura y analizar
        if: steps.config.outputs.enabled == 'true'
        run: |
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=santiagoferreyraa \
            -Dsonar.projectKey=santiagoferreyraa_dai_2_tpo_grupo_12 \
            -Dsonar.qualitygate.wait=true

  # QA-05 (ECO-155): la colección de API, contra el sistema corriendo de verdad.
  #
  # Los cuatro backends y los tres simuladores con el perfil dev (H2 en memoria) y un Artemis real como servicio del
  # runner, así el aviso de la reserva viaja por la cola de punta a punta. La contraseña del
  # broker sale del número de corrida: no es un secreto, el contenedor muere con el job.
  #
  # Los usuarios ADMIN y CPO los crea qa/ci/start-stack.sh con contraseñas al azar de esa corrida.
  #
  # QA-25 (ECO-175): después de Newman, las pruebas de contrato con Schemathesis contra el OpenAPI
  # de cada módulo, sobre el mismo sistema levantado.
  api:
    name: API (Newman)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ECOPEDIA_BROKER_PASSWORD: qa-${{ github.run_id }}

    services:
      artemis:
        image: apache/activemq-artemis:2.42.0
        env:
          ARTEMIS_USER: ecopedia
          ARTEMIS_PASSWORD: qa-${{ github.run_id }}
        ports:
          - 61616:61616

    steps:
      - uses: actions/checkout@v4

      - name: Preparar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Sin tests: ya los corre el job backend. Acá solo hacen falta los JAR.
      - name: Construir los JAR
        run: mvn -B -Dmaven.test.skip=true -Dspotless.check.skip=true package

      - name: Levantar backends y simuladores
        run: |
          python3 -m pip install --quiet --user --break-system-packages bcrypt
          bash qa/ci/start-stack.sh

      - name: Correr la colección de API
        run: |
          npx --yes newman@6 run qa/postman/ecopedia.postman_collection.json \
            --env-var coreUrl=http://localhost:8081 \
            --env-var chargingUrl=http://localhost:8082 \
            --env-var integrationUrl=http://localhost:8083 \
            --env-var asyncUrl=http://localhost:8084 \
            --env-var adminEmail="$QA_ADMIN_EMAIL" \
            --env-var adminPassword="$QA_ADMIN_PASSWORD" \
            --env-var cpoEmail="$QA_CPO_EMAIL" \
            --env-var cpoPassword="$QA_CPO_PASSWORD" \
            --reporters cli,junit \
            --reporter-junit-export qa/newman/results.xml

      # Corre aunque Newman haya fallado: son pruebas distintas y conviene ver las dos.
      - name: Pruebas de contrato (Schemathesis)
        if: ${{ !cancelled() }}
        run: |
          python3 -m pip install --quiet --user --break-system-packages schemathesis==4.34.2
          export PATH="$HOME/.local/bin:$PATH"
          bash qa/ci/schemathesis.sh

      - name: Guardar resultados y logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman
          path: |
            qa/newman/
            qa/schemathesis/
            qa/ci/logs/

      - name: Bajar los backends
        if: always()
        run: bash qa/ci/stop-stack.sh

  # QA-20 (ECO-170): los escenarios de punta a punta con Playwright (frontend/e2e/), en un navegador
  # contra el sistema entero: el mismo arranque que el job `api`, más el front armado y servido con
  # `vite preview`, que reparte /api con el proxy de siempre. Lo levanta playwright.config.ts.
  #
  # Va aparte del job `api` y no después de Schemathesis: Schemathesis crea y borra datos al azar
  # (y bloquea al ADMIN), y los escenarios cuentan con las 15 estaciones de la siembra tal cual.
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ECOPEDIA_BROKER_PASSWORD: qa-${{ github.run_id }}

    services:
      artemis:
        image: apache/activemq-artemis:2.42.0
        env:
          ARTEMIS_USER: ecopedia
          ARTEMIS_PASSWORD: qa-${{ github.run_id }}
        ports:
          - 61616:61616

    steps:
      - uses: actions/checkout@v4

      - name: Preparar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Antes de setup-node, por lo mismo que en el job del front.
      - name: Preparar pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Construir los JAR
        run: mvn -B -Dmaven.test.skip=true -Dspotless.check.skip=true package

      - name: Levantar backends y simuladores
        run: |
          python3 -m pip install --quiet --user --break-system-packages bcrypt
          bash qa/ci/start-stack.sh

      - name: Instalar dependencias del front y el navegador
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Armar el front
        working-directory: frontend
        run: pnpm run build

      - name: Correr los escenarios
        working-directory: frontend
        run: pnpm run e2e

      # El informe HTML trae, de cada escenario que falló, la captura y la traza paso a paso
      # (se abre con `pnpm exec playwright show-trace`).
      - name: Guardar el informe y los logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e
          path: |
            frontend/playwright-report/
            frontend/test-results/
            qa/ci/logs/

      - name: Bajar los backends
        if: always()
        run: bash qa/ci/stop-stack.sh
