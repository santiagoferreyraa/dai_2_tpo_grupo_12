# Procesos de desarrollo. Los levanta `pnpm dev`.
#
# mprocs muestra todos en la misma terminal pero SEPARADOS: la lista de procesos queda a
# la izquierda y el log del que esté seleccionado ocupa el resto. Cada uno conserva su
# propio scroll, así que el log del backend no se mezcla con el de Vite. Las teclas están
# siempre a la vista, en el recuadro de ayuda de abajo a la izquierda.
#
# La ventaja sobre correr los cuatro con prefijos en la misma consola no es solo visual: desde
# el TUI se reinicia UNO SOLO —el backend después de tocar una clase, por ejemplo— sin
# bajar los demás ni perder el estado del navegador.
#
# Los comandos son los mismos scripts del package.json, no comandos sueltos: así `pnpm dev`
# y `pnpm dev:back` levantan exactamente lo mismo y no hay dos definiciones que mantener
# sincronizadas.
#
# Son OCHO, y cada uno es un artefacto desplegable distinto. `charging` es Reservas (8082) y
# necesita a `back` arriba: antes de retener un slot le pregunta a core por el conector. `pay` es
# Pagos, que vive en ecopedia-integration (8083). `async` es Notificaciones (8084). `gateway` NO es
# Ecopedia: es la pasarela de pagos simulada (8086), el sistema externo al que Pagos le habla por
# REST. Sin ella, cargar una tarjeta contesta "probá de nuevo en un momento". `grid` tampoco es
# Ecopedia: es la distribuidora eléctrica simulada (8087), el legado al que RedEléctrica le pregunta
# por SOAP antes de una carga rápida. Hoy no la llama ninguna pantalla (eso llega con ECO-52), así
# que bajarla no rompe nada. `charger` tampoco es Ecopedia: son los cargadores simulados (8088), que
# Terminales enciende y apaga por REST y que publican la telemetría en el tópico telemetry.charging.
# Como `async`, quiere el broker: sin él, contesta que no puede encender. Hoy tampoco lo llama ninguna
# pantalla (eso llega con ECO-44). Ver ARQUITECTURA §6.4.
#
# Para trabajar solo en el mapa o en el ABM alcanza con `back` y `front`; los otros tres hacen
# falta para reservas, para la pantalla de medios de pago y para los avisos.
#
# **`async` es el único que quiere algo que no está acá: el broker.** Los avisos nacen en una cola
# de Artemis, que vive en `docker-compose.yml`, así que sin `docker compose up -d activemq` este
# proceso arranca igual —la campanita y la pantalla del perfil contestan— pero no le llega ningún
# aviso nuevo, y su panel se llena de reintentos de conexión. Estaba fuera de esta lista por eso
# justamente; está adentro ahora porque un proceso que falta se nota mucho menos que un panel
# ruidoso, y el que reservaba esperando un aviso no tenía forma de saber por qué no llegaba.
# El panel es suyo y no molesta a los otros cuatro: para eso están separados.
#
# ---
#
# Éste es el ambiente PROPIO Y PERSISTENTE: perfil `local`, H2 en archivo. Tus datos
# sobreviven a bajar y volver a levantar, y no necesitás Docker ni instalar nada.
#
# Hay dos hermanos de este archivo, para los otros dos ambientes:
#
#   mprocs-mem.yaml   ->  `pnpm dev:mem`   H2 en memoria, se borra al bajar
#   mprocs-demo.yaml  ->  `pnpm demo`      PostgreSQL, el ambiente de la demo
#
# Cuándo usar cada uno está en el README, sección "Cómo levantar el proyecto".
procs:
  back:
    shell: pnpm dev:back
  charging:
    shell: pnpm dev:charging
  pay:
    shell: pnpm dev:pay
  async:
    shell: pnpm dev:async
  gateway:
    shell: pnpm dev:gateway
  grid:
    shell: pnpm dev:grid
  charger:
    shell: pnpm dev:charger
  front:
    shell: pnpm dev:front
