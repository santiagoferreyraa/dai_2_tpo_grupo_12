# Qué hace Artemis con un mensaje que el consumidor no puede procesar (QA-28).
#
# Lo aplica `artemis run --properties` en cada arranque (ver docker-compose.yml), encima del
# broker.xml que la imagen genera la primera vez. Por eso vale también para un volumen que ya
# existía: el directorio `etc-override` de la imagen solo se copia al crear la instancia.
#
# "#" es todo destino: notifications.dispatch hoy y telemetry.charging cuando tenga suscriptor.
#
# Cinco intentos con espera creciente: 2, 4, 8 y 16 segundos entre uno y otro, unos 30 segundos en
# total. Alcanza para que un corte corto (la base que se reinicia) no mande un aviso a la DLQ, y no
# es tanto como para que un mensaje ilegible quede dando vueltas.
#
# El quinto fallo lo aparta en una cola propia por destino, DLQ.notifications.dispatch, que Artemis
# crea sola en la dirección DLA. Desde la consola se reenvía a su cola original (README, "Mensajes
# que no se pudieron procesar").
#
# DLA y no DLQ, a propósito: el broker.xml de la imagen ya trae una dirección DLQ con una cola
# común, y con esa dirección cada mensaje quedaba en las dos colas (comprobado en vivo el 02/11).
# Reprocesar una dejaba la otra copia colgada. DeadLetterQueueTest falla si vuelve a pasar.
#
# Artemis crea DLQ.notifications.dispatch solo si no existe otra cola con ese nombre en cualquier
# dirección: si alguna vez quedó una en DLQ, los mensajes se descartan con el WARN AMQ222148 ("has
# no bindings so dropping it") hasta que se la borra desde la consola.
#
# Los tests de ecopedia-async cargan este mismo archivo en su broker embebido, y comparan
# maxDeliveryAttempts con ecopedia.notifications.max-delivery-attempts: si cambia acá, cambia allá.

addressSettings."#".maxDeliveryAttempts=5
addressSettings."#".redeliveryDelay=2000
addressSettings."#".redeliveryMultiplier=2
addressSettings."#".maxRedeliveryDelay=16000
addressSettings."#".deadLetterAddress=DLA
addressSettings."#".autoCreateDeadLetterResources=true
