# Los procesos de la demo, contra PostgreSQL. Los levanta `pnpm demo`.
#
# Es el ambiente sobre el que se defienden las entregas, y el único de los tres que puede
# ser COMPARTIDO: una sola base que ven todos los que apunten a esa máquina.
#
# ANTES de levantar esto tiene que estar el .env y arriba la infraestructura:
#
#   pnpm env:init       (una sola vez: genera los secretos)
#   docker compose up -d
#
# Si no, el backend no arranca y falla con "Connection refused". La alternativa sin Docker
# es un PostgreSQL instalado en la máquina, escuchando en el 5432 con la base y el usuario que
# declara docker-compose.yml y la contraseña del .env. Ver el README.
#
# Sin .env, los backends no arrancan: sin perfil no hay secreto del JWT por defecto.
#
# No lleva perfil: el perfil por defecto de los módulos ya apunta a PostgreSQL.
#
# **Son cinco, uno más que en `pnpm dev`.** `async` es Notificaciones (8084), y está solo acá
# porque es el único ambiente que ya exige el broker: sin Docker, `async` arranca igual pero
# reintenta la conexión y llena su panel de avisos. En desarrollo se levanta aparte, con
# `pnpm dev:async`, cuando se está trabajando sobre las notificaciones.
procs:
  back:
    shell: pnpm demo:back
  charging:
    shell: pnpm demo:charging
  pay:
    shell: pnpm demo:pay
  async:
    shell: pnpm demo:async
  front:
    shell: pnpm dev:front
